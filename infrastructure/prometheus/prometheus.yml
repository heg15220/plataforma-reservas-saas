global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: reserly-demand-engine

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: reserly-demand-engine
    metrics_path: /internal/demand/v1/metrics
    scheme: http
    static_configs:
      - targets: [demand-engine:8090]
        labels:
          component: demand-engine

