name: reserly

services:
  demand-engine:
    build:
      context: ..
      dockerfile: apps/demand-engine/Dockerfile
    restart: unless-stopped
    environment:
      RESERLY_DEMAND_ENGINE_ENVIRONMENT: ${RESERLY_DEMAND_ENGINE_ENVIRONMENT:-local}
      RESERLY_DEMAND_ENGINE_HOST: 0.0.0.0
      RESERLY_DEMAND_ENGINE_PORT: 8090
      RESERLY_DEMAND_ENGINE_SERVICE_ID: ${RESERLY_DEMAND_ENGINE_SERVICE_ID:?RESERLY_DEMAND_ENGINE_SERVICE_ID is required}
      RESERLY_DEMAND_ENGINE_SERVICE_TOKEN: ${RESERLY_DEMAND_ENGINE_SERVICE_TOKEN:?RESERLY_DEMAND_ENGINE_SERVICE_TOKEN is required}
      RESERLY_DEMAND_ENGINE_REQUEST_TIMEOUT_SECONDS: ${RESERLY_DEMAND_ENGINE_REQUEST_TIMEOUT_SECONDS:-0.2}
      RESERLY_DEMAND_ENGINE_MAXIMUM_REQUEST_BYTES: ${RESERLY_DEMAND_ENGINE_MAXIMUM_REQUEST_BYTES:-65536}
      RESERLY_DEMAND_ENGINE_DOCS_ENABLED: ${RESERLY_DEMAND_ENGINE_DOCS_ENABLED:-false}
      RESERLY_DEMAND_ENGINE_LOG_LEVEL: ${RESERLY_DEMAND_ENGINE_LOG_LEVEL:-INFO}
    ports:
      - 127.0.0.1:${RESERLY_DEMAND_ENGINE_PORT:-8090}:8090
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/internal/demand/v1/health/ready', timeout=1)"
      interval: 10s
      timeout: 2s
      retries: 6
      start_period: 5s
    stop_grace_period: 10s

  postgres:
    image: reserly/postgres:17-3.5-vector0.8.6
    build:
      context: ..
      dockerfile: infrastructure/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RESERLY_DATABASE_NAME:-reserly}
      POSTGRES_USER: ${RESERLY_DATABASE_USERNAME:-reserly}
      POSTGRES_PASSWORD: ${RESERLY_DATABASE_PASSWORD:?RESERLY_DATABASE_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - password_encryption=scram-sha-256
    ports:
      - 127.0.0.1:${RESERLY_DATABASE_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  redis:
    image: redis:8.8.0-alpine@sha256:09160599abd229764c0fb44cb6be640294e1d360a54b19985ab4843dcf2d90f1
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${RESERLY_REDIS_PASSWORD:?RESERLY_REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}"
    ports:
      - 127.0.0.1:${RESERLY_REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 15s

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine@sha256:a2b8ca223e4b6b91ce6dac5a87e8d4551974a7d8dc8c919d333b757507966ffd
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RESERLY_RABBITMQ_USERNAME:?RESERLY_RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RESERLY_RABBITMQ_PASSWORD:?RESERLY_RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - 127.0.0.1:${RESERLY_RABBITMQ_PORT:-5672}:5672
      - 127.0.0.1:${RESERLY_RABBITMQ_MANAGEMENT_PORT:-15672}:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /tmp/mailpit.db
    ports:
      - 127.0.0.1:${RESERLY_EMAIL_SMTP_PORT:-1025}:1025
      - 127.0.0.1:${RESERLY_MAILPIT_WEB_PORT:-8025}:8025

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${RESERLY_S3_ACCESS_KEY:?RESERLY_S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${RESERLY_S3_SECRET_KEY:?RESERLY_S3_SECRET_KEY is required}
    command:
      - server
      - /data
      - --console-address
      - :9001
    ports:
      - 127.0.0.1:${RESERLY_S3_PORT:-9000}:9000
      - 127.0.0.1:${RESERLY_S3_CONSOLE_PORT:-9001}:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  mlflow-postgres:
    image: reserly/postgres:17-3.5-vector0.8.6
    build:
      context: ..
      dockerfile: infrastructure/postgres/Dockerfile
    profiles: [mlops]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RESERLY_MLFLOW_DATABASE_NAME:-mlflow}
      POSTGRES_USER: ${RESERLY_MLFLOW_DATABASE_USERNAME:-mlflow}
      POSTGRES_PASSWORD: ${RESERLY_MLFLOW_DATABASE_PASSWORD:?RESERLY_MLFLOW_DATABASE_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - mlflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  mlflow-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    profiles: [mlops]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      RESERLY_S3_ACCESS_KEY: ${RESERLY_S3_ACCESS_KEY:?RESERLY_S3_ACCESS_KEY is required}
      RESERLY_S3_SECRET_KEY: ${RESERLY_S3_SECRET_KEY:?RESERLY_S3_SECRET_KEY is required}
      RESERLY_MLFLOW_S3_BUCKET: ${RESERLY_MLFLOW_S3_BUCKET:-reserly-mlflow-local}
    entrypoint: /bin/sh
    command:
      - -eu
      - -c
      - |
        mc alias set reserly http://minio:9000 "$${RESERLY_S3_ACCESS_KEY}" "$${RESERLY_S3_SECRET_KEY}"
        mc mb --ignore-existing "reserly/$${RESERLY_MLFLOW_S3_BUCKET}"
        mc anonymous set none "reserly/$${RESERLY_MLFLOW_S3_BUCKET}"
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1-full@sha256:9f9276e57cda1593cfa0fe8519145cd49328e119e85951851b9244e82e3769be
    profiles: [mlops]
    restart: unless-stopped
    depends_on:
      mlflow-postgres:
        condition: service_healthy
      mlflow-minio-init:
        condition: service_completed_successfully
    environment:
      RESERLY_MLFLOW_DATABASE_NAME: ${RESERLY_MLFLOW_DATABASE_NAME:-mlflow}
      RESERLY_MLFLOW_DATABASE_USERNAME: ${RESERLY_MLFLOW_DATABASE_USERNAME:-mlflow}
      RESERLY_MLFLOW_DATABASE_PASSWORD: ${RESERLY_MLFLOW_DATABASE_PASSWORD:?RESERLY_MLFLOW_DATABASE_PASSWORD is required}
      RESERLY_MLFLOW_ADMIN_USERNAME: ${RESERLY_MLFLOW_ADMIN_USERNAME:?RESERLY_MLFLOW_ADMIN_USERNAME is required}
      RESERLY_MLFLOW_ADMIN_PASSWORD: ${RESERLY_MLFLOW_ADMIN_PASSWORD:?RESERLY_MLFLOW_ADMIN_PASSWORD is required}
      RESERLY_MLFLOW_ALLOWED_HOSTS: ${RESERLY_MLFLOW_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,mlflow:5000}
      RESERLY_MLFLOW_S3_BUCKET: ${RESERLY_MLFLOW_S3_BUCKET:-reserly-mlflow-local}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${RESERLY_MLFLOW_FLASK_SECRET_KEY:?RESERLY_MLFLOW_FLASK_SECRET_KEY is required}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${RESERLY_S3_ACCESS_KEY:?RESERLY_S3_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${RESERLY_S3_SECRET_KEY:?RESERLY_S3_SECRET_KEY is required}
      AWS_DEFAULT_REGION: ${RESERLY_S3_REGION:-us-east-1}
      MLFLOW_ARTIFACT_UPLOAD_DOWNLOAD_TIMEOUT: 60
    entrypoint: [python, /opt/reserly/mlflow/entrypoint.py]
    volumes:
      - ./mlflow:/opt/reserly/mlflow:ro
    ports:
      - 127.0.0.1:${RESERLY_MLFLOW_PORT:-5000}:5000
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  mlflow-access-bootstrap:
    image: ghcr.io/mlflow/mlflow:v3.15.1-full@sha256:9f9276e57cda1593cfa0fe8519145cd49328e119e85951851b9244e82e3769be
    profiles: [mlops]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      RESERLY_ENVIRONMENT: ${RESERLY_ENVIRONMENT:?RESERLY_ENVIRONMENT is required}
      RESERLY_MLFLOW_ADMIN_USERNAME: ${RESERLY_MLFLOW_ADMIN_USERNAME:?RESERLY_MLFLOW_ADMIN_USERNAME is required}
      RESERLY_MLFLOW_ADMIN_PASSWORD: ${RESERLY_MLFLOW_ADMIN_PASSWORD:?RESERLY_MLFLOW_ADMIN_PASSWORD is required}
      RESERLY_MLFLOW_TRAINING_USERNAME: ${RESERLY_MLFLOW_TRAINING_USERNAME:?RESERLY_MLFLOW_TRAINING_USERNAME is required}
      RESERLY_MLFLOW_TRAINING_PASSWORD: ${RESERLY_MLFLOW_TRAINING_PASSWORD:?RESERLY_MLFLOW_TRAINING_PASSWORD is required}
      RESERLY_MLFLOW_TRAINING_SECRET_VERSION: ${RESERLY_MLFLOW_TRAINING_SECRET_VERSION:?RESERLY_MLFLOW_TRAINING_SECRET_VERSION is required}
      RESERLY_MLFLOW_REGISTRATION_USERNAME: ${RESERLY_MLFLOW_REGISTRATION_USERNAME:?RESERLY_MLFLOW_REGISTRATION_USERNAME is required}
      RESERLY_MLFLOW_REGISTRATION_PASSWORD: ${RESERLY_MLFLOW_REGISTRATION_PASSWORD:?RESERLY_MLFLOW_REGISTRATION_PASSWORD is required}
      RESERLY_MLFLOW_REGISTRATION_SECRET_VERSION: ${RESERLY_MLFLOW_REGISTRATION_SECRET_VERSION:?RESERLY_MLFLOW_REGISTRATION_SECRET_VERSION is required}
      RESERLY_MLFLOW_INFERENCE_USERNAME: ${RESERLY_MLFLOW_INFERENCE_USERNAME:?RESERLY_MLFLOW_INFERENCE_USERNAME is required}
      RESERLY_MLFLOW_INFERENCE_PASSWORD: ${RESERLY_MLFLOW_INFERENCE_PASSWORD:?RESERLY_MLFLOW_INFERENCE_PASSWORD is required}
      RESERLY_MLFLOW_INFERENCE_SECRET_VERSION: ${RESERLY_MLFLOW_INFERENCE_SECRET_VERSION:?RESERLY_MLFLOW_INFERENCE_SECRET_VERSION is required}
    entrypoint: [python, /opt/reserly/mlflow/bootstrap_access.py]
    volumes:
      - ./mlflow:/opt/reserly/mlflow:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1770
    restart: "no"

  prefect-postgres:
    image: reserly/postgres:17-3.5-vector0.8.6
    build:
      context: ..
      dockerfile: infrastructure/postgres/Dockerfile
    profiles: [mlops]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RESERLY_PREFECT_DATABASE_NAME:-prefect}
      POSTGRES_USER: ${RESERLY_PREFECT_DATABASE_USERNAME:-prefect}
      POSTGRES_PASSWORD: ${RESERLY_PREFECT_DATABASE_PASSWORD:?RESERLY_PREFECT_DATABASE_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - prefect-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  prefect-server:
    image: prefecthq/prefect:3.8.2-python3.13@sha256:1bbbd69307e8dc05900727b4ed9f00a34d32a31113d16d32a398f41de2f69568
    profiles: [mlops]
    restart: unless-stopped
    depends_on:
      prefect-postgres:
        condition: service_healthy
    environment:
      RESERLY_PREFECT_ROLE: server
      RESERLY_PREFECT_DATABASE_NAME: ${RESERLY_PREFECT_DATABASE_NAME:-prefect}
      RESERLY_PREFECT_DATABASE_USERNAME: ${RESERLY_PREFECT_DATABASE_USERNAME:-prefect}
      RESERLY_PREFECT_DATABASE_PASSWORD: ${RESERLY_PREFECT_DATABASE_PASSWORD:?RESERLY_PREFECT_DATABASE_PASSWORD is required}
      RESERLY_PREFECT_AUTH_USERNAME: ${RESERLY_PREFECT_AUTH_USERNAME:?RESERLY_PREFECT_AUTH_USERNAME is required}
      RESERLY_PREFECT_AUTH_PASSWORD: ${RESERLY_PREFECT_AUTH_PASSWORD:?RESERLY_PREFECT_AUTH_PASSWORD is required}
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_SERVER_API_CORS_ALLOWED_ORIGINS: ${RESERLY_PREFECT_CORS_ALLOWED_ORIGINS:-["http://localhost:4200"]}
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    entrypoint: [python, /opt/reserly/prefect/entrypoint.py]
    volumes:
      - ./prefect:/opt/reserly/prefect:ro
    ports:
      - 127.0.0.1:${RESERLY_PREFECT_PORT:-4200}:4200
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import base64,os,urllib.request; auth=os.environ['RESERLY_PREFECT_AUTH_USERNAME']+':'+os.environ['RESERLY_PREFECT_AUTH_PASSWORD']; token=base64.b64encode(auth.encode()).decode(); request=urllib.request.Request('http://127.0.0.1:4200/api/health',headers={'Authorization':'Basic '+token}); urllib.request.urlopen(request,timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s
    stop_grace_period: 30s

  prefect-worker:
    image: prefecthq/prefect:3.8.2-python3.13@sha256:1bbbd69307e8dc05900727b4ed9f00a34d32a31113d16d32a398f41de2f69568
    profiles: [mlops]
    restart: unless-stopped
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      RESERLY_PREFECT_ROLE: worker
      RESERLY_PREFECT_AUTH_USERNAME: ${RESERLY_PREFECT_AUTH_USERNAME:?RESERLY_PREFECT_AUTH_USERNAME is required}
      RESERLY_PREFECT_AUTH_PASSWORD: ${RESERLY_PREFECT_AUTH_PASSWORD:?RESERLY_PREFECT_AUTH_PASSWORD is required}
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_WORKER_QUERY_SECONDS: 10
      PREFECT_LOGGING_LEVEL: INFO
    entrypoint: [python, /opt/reserly/prefect/entrypoint.py]
    volumes:
      - ./prefect:/opt/reserly/prefect:ro
      - ../apps/demand-engine:/opt/reserly/apps/demand-engine:ro
      - ../packages/demand-contracts:/opt/reserly/packages/demand-contracts:ro
    working_dir: /opt/reserly/apps/demand-engine
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v3.5.3@sha256:ddc2493835a1509976d5e4e0c94199c4f843ce1f42dd6bcfc8231ba734a93ff7
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      demand-engine:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:${RESERLY_PROMETHEUS_PORT:-9090}:9090
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1770
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 20s

  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${RESERLY_GRAFANA_ADMIN_USERNAME:?RESERLY_GRAFANA_ADMIN_USERNAME is required}
      GF_SECURITY_ADMIN_PASSWORD: ${RESERLY_GRAFANA_ADMIN_PASSWORD:?RESERLY_GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:${RESERLY_GRAFANA_PORT:-3000}:3000
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 20s
    stop_grace_period: 20s

  clamav:
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    restart: unless-stopped
    ports:
      - 127.0.0.1:${RESERLY_CLAMAV_PORT:-3310}:3310
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test:
        - CMD
        - clamdscan
        - --ping
        - "1"
      interval: 20s
      timeout: 10s
      retries: 18
      start_period: 90s
    stop_grace_period: 30s

volumes:
  clamav-data:
  minio-data:
  mlflow-postgres-data:
  prometheus-data:
  grafana-data:
  prefect-postgres-data:
  postgres-data:
  rabbitmq-data:
  redis-data:
