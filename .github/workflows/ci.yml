name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - "phase/**"
      - "release/**"
      - "hotfix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Install Node.js dependencies
        run: npm ci

      - name: Validate CI contract
        run: npm run ci:check

      - name: Validate environment templates
        run: npm run env:check

      - name: Validate i18n contracts
        run: npm run i18n:check

      - name: Validate backend conventions
        run: npm run backend:conventions:check

      - name: Check formatting
        run: npm run format:check

      - name: Run linters
        run: npm run lint

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test:web

      - name: Build frontend
        run: npm run build:web:test

  backend:
    name: Backend integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Run backend tests with Testcontainers
        run: mvn --batch-mode --no-transfer-progress --file apps/api/pom.xml test -Dspring.profiles.active=test

      - name: Build backend
        run: mvn --batch-mode --no-transfer-progress --file apps/api/pom.xml package -DskipTests
