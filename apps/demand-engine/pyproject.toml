[project]
name = "reserly-demand-engine"
version = "0.1.0"
description = "Servicio interno consultivo de matching y demanda de Reserly"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "pydantic==2.11.3",
  "uvicorn==0.34.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
reserly-demand-engine = "reserly_demand_engine.cli:run"
