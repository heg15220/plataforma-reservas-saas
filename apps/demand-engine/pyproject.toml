[project]
name = "reserly-demand-engine"
version = "0.1.0"
description = "Servicio interno consultivo de matching y demanda de Reserly"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "pydantic==2.11.3",
  "prometheus-client==0.26.0",
  "uvicorn==0.34.1",
]

[project.optional-dependencies]
mlops = [
  "evidently==0.7.21",
  "mlflow[auth]==3.15.1",
  "prefect==3.8.2",
]
ml = [
  "torch==2.8.0",
  "sentence-transformers==5.7.0",
  "transformers==4.56.2",
  "pillow==11.3.0",
  "catboost==1.2.10",
  "umap-learn==0.5.12",
  "hdbscan==0.8.44",
  "bertopic==0.17.4",
  "xgboost==3.3.0",
  "ortools==9.15.6755",
  "river==0.25.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
reserly-demand-engine = "reserly_demand_engine.cli:run"
reserly-demand-evaluate-embeddings = "reserly_demand_engine.embedding_evaluation:run"
reserly-demand-evaluate-promotion = "reserly_demand_engine.promotion:run"
reserly-demand-train-conversion = "reserly_demand_engine.conversion_training:run"
reserly-demand-train-choice = "reserly_demand_engine.discrete_choice:run"
reserly-demand-conversion-analytics = "reserly_demand_engine.conversion_analytics:run"
reserly-demand-validate-lineage = "reserly_demand_engine.lineage:run"
reserly-demand-validate-data = "reserly_demand_engine.data_validation:run"
reserly-demand-report-evidently = "reserly_demand_engine.evidently_reporting:run"
reserly-demand-validate-governance-docs = "reserly_demand_engine.governance_documentation:run"
reserly-demand-validate-operational-readiness = "reserly_demand_engine.operational_readiness:run"
reserly-demand-generate-synthetic-marketplace = "reserly_demand_engine.synthetic_marketplace:run"
reserly-demand-evaluate-synthetic-visuals = "reserly_demand_engine.synthetic_visual_qa:run"
reserly-demand-train-visual-category = "reserly_demand_engine.visual_training:run"
reserly-demand-authorize-visual-dataset = "reserly_demand_engine.visual_dataset_authorization:run"
reserly-demand-materialize-visual-embeddings = "reserly_demand_engine.visual_embedding_dataset:run"
reserly-demand-diagnose-visual-training = "reserly_demand_engine.visual_training_diagnostics:run"
reserly-demand-train-robust-visual-development = "reserly_demand_engine.visual_robust_training:run"
reserly-demand-evaluate-recommendation-cv = "reserly_demand_engine.recommendation_cross_validation:run"
reserly-demand-generate-diverse-recommendation-data = "reserly_demand_engine.recommendation_diverse_dataset:run"
reserly-demand-train-diverse-recommendation = "reserly_demand_engine.recommendation_diverse_training:run"
reserly-demand-generate-pixel-recommendation-data = "reserly_demand_engine.recommendation_pixel_dataset:run"
reserly-demand-train-pixel-recommendation = "reserly_demand_engine.recommendation_pixel_training:run"
reserly-demand-generate-action-context-data = "reserly_demand_engine.recommendation_action_context_dataset:run"
reserly-demand-train-action-context = "reserly_demand_engine.recommendation_action_context_training:run"
reserly-demand-build-full-taxonomy-visual-dataset = "reserly_demand_engine.full_taxonomy_visual_dataset:run"
reserly-demand-evaluate-full-taxonomy-visuals = "reserly_demand_engine.full_taxonomy_visual_evaluation:run"
reserly-demand-build-full-taxonomy-holdout = "reserly_demand_engine.full_taxonomy_visual_holdout:run"
reserly-demand-qa-full-taxonomy-holdout = "reserly_demand_engine.full_taxonomy_visual_holdout_qa:run"
reserly-demand-authorize-full-taxonomy-visuals = "reserly_demand_engine.full_taxonomy_visual_authorization:run"
reserly-demand-train-full-taxonomy-visuals = "reserly_demand_engine.full_taxonomy_visual_training_v2:run"
reserly-demand-build-full-taxonomy-multiview-v3 = "reserly_demand_engine.full_taxonomy_visual_multiview_v3:run"
reserly-demand-qa-full-taxonomy-multiview-v3 = "reserly_demand_engine.full_taxonomy_visual_multiview_v3_qa:run"
reserly-demand-review-full-taxonomy-multiview-v3 = "reserly_demand_engine.full_taxonomy_visual_multiview_v3_review:run"
reserly-demand-authorize-full-taxonomy-multiview-v3 = "reserly_demand_engine.full_taxonomy_visual_multiview_v3_authorization:run"
reserly-demand-train-full-taxonomy-multiview-v3 = "reserly_demand_engine.full_taxonomy_visual_multiview_v3_training:run"
reserly-demand-open-full-taxonomy-multiview-v3 = "reserly_demand_engine.full_taxonomy_visual_multiview_v3_holdout:run"
reserly-demand-train-full-taxonomy-multiregion-v4 = "reserly_demand_engine.full_taxonomy_visual_multiregion_v4:run"
reserly-demand-build-taxonomy-relabel = "reserly_demand_engine.venue_taxonomy:run"
