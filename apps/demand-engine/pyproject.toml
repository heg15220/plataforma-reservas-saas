[project]
name = "reserly-demand-engine"
version = "0.1.0"
description = "Servicio interno consultivo de matching y demanda de Reserly"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "pydantic==2.11.3",
  "prometheus-client==0.26.0",
  "uvicorn==0.34.1",
]

[project.optional-dependencies]
mlops = [
  "mlflow[auth]==3.15.1",
  "prefect==3.8.2",
]
ml = [
  "sentence-transformers==5.7.0",
  "transformers==4.56.2",
  "pillow==11.3.0",
  "catboost==1.2.10",
  "umap-learn==0.5.12",
  "hdbscan==0.8.44",
  "bertopic==0.17.4",
  "xgboost==3.3.0",
  "ortools==9.15.6755",
  "river==0.25.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
reserly-demand-engine = "reserly_demand_engine.cli:run"
reserly-demand-evaluate-embeddings = "reserly_demand_engine.embedding_evaluation:run"
reserly-demand-evaluate-promotion = "reserly_demand_engine.promotion:run"
reserly-demand-train-conversion = "reserly_demand_engine.conversion_training:run"
reserly-demand-train-choice = "reserly_demand_engine.discrete_choice:run"
reserly-demand-conversion-analytics = "reserly_demand_engine.conversion_analytics:run"
reserly-demand-validate-lineage = "reserly_demand_engine.lineage:run"
reserly-demand-validate-data = "reserly_demand_engine.data_validation:run"
