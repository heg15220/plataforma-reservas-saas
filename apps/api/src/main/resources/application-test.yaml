spring:
  cache:
    type: none
  data:
    redis:
      url: redis://localhost:1
  datasource:
    driverClassName: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:reserly:17-3.5-vector0.8.6:///reserly_test
    username: test
    password: test
    hikari:
      maximumPoolSize: 3
      minimumIdle: 1
  rabbitmq:
    addresses: amqp://guest:guest@localhost:1
    dynamic: false

reserly:
  environment: test
  apiPublicBaseUrl: http://localhost:8080
  webPublicBaseUrl: http://localhost:3000
  allowedOrigins:
    - http://localhost:3000
  security:
    secureCookies: false
  rate-limit:
    enabled: false
  demand:
    ingestion:
      enabled: true
      serviceId: test-producer
      serviceToken: test-demand-token-at-least-32-characters
      maximumBatchSize: 100
      retention: 90d
  features:
    realPaymentsEnabled: false
