spring:
  application:
    name: reserly-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      maxFileSize: ${RESERLY_DOCUMENT_MAX_BYTES:10485760}B
      maxRequestSize: ${RESERLY_DOCUMENT_REQUEST_MAX_BYTES:11534336}B
  cache:
    type: redis
    redis:
      cacheNullValues: false
      keyPrefix: "reserly::"
      timeToLive: ${RESERLY_CACHE_DEFAULT_TTL:5m}
      useKeyPrefix: true
  data:
    redis:
      url: ${RESERLY_REDIS_URL}
      connectTimeout: ${RESERLY_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${RESERLY_REDIS_COMMAND_TIMEOUT:2s}
  datasource:
    url: ${RESERLY_DATABASE_URL}
    username: ${RESERLY_DATABASE_USERNAME}
    password: ${RESERLY_DATABASE_PASSWORD}
    hikari:
      connectionInitSql: SET TIME ZONE 'UTC'
      connectionTimeout: ${RESERLY_DATABASE_CONNECTION_TIMEOUT_MS:30000}
      maximumPoolSize: ${RESERLY_DATABASE_MAX_POOL_SIZE:10}
      minimumIdle: ${RESERLY_DATABASE_MIN_IDLE:2}
      poolName: ReserlyDatabasePool
  flyway:
    baselineOnMigrate: false
    cleanDisabled: true
    enabled: true
    locations: classpath:db/migration
    validateMigrationNaming: true
    validateOnMigrate: true
  jpa:
    hibernate:
      ddlAuto: validate
    openInView: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    addresses: ${RESERLY_RABBITMQ_URL}
    connectionTimeout: ${RESERLY_RABBITMQ_CONNECTION_TIMEOUT:5s}
    publisherConfirmType: correlated
    publisherReturns: true
    requestedHeartbeat: ${RESERLY_RABBITMQ_REQUESTED_HEARTBEAT:30s}
    template:
      mandatory: true
      retry:
        enabled: true
        initialInterval: 500ms
        maxAttempts: 3
        maxInterval: 5s
        multiplier: 2
  mail:
    host: ${RESERLY_EMAIL_SMTP_HOST:localhost}
    port: ${RESERLY_EMAIL_SMTP_PORT:1025}
    username: ${RESERLY_EMAIL_SMTP_USERNAME:}
    password: ${RESERLY_EMAIL_SMTP_PASSWORD:}
    testConnection: false
    properties:
      mail:
        smtp:
          auth: ${RESERLY_EMAIL_SMTP_AUTH:false}
          connectiontimeout: ${RESERLY_EMAIL_SMTP_CONNECTION_TIMEOUT_MS:3000}
          timeout: ${RESERLY_EMAIL_SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${RESERLY_EMAIL_SMTP_WRITE_TIMEOUT_MS:5000}
          starttls:
            enable: ${RESERLY_EMAIL_SMTP_STARTTLS:false}
            required: ${RESERLY_EMAIL_SMTP_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${RESERLY_EMAIL_SMTP_SSL:false}

reserly:
  environment: ${RESERLY_ENVIRONMENT}
  apiPublicBaseUrl: ${RESERLY_PUBLIC_BASE_URL}
  webPublicBaseUrl: ${RESERLY_WEB_BASE_URL}
  allowedOrigins: ${RESERLY_ALLOWED_ORIGINS}
  security:
    secureCookies: ${RESERLY_SECURE_COOKIES}
  rate-limit:
    enabled: ${RESERLY_RATE_LIMIT_ENABLED:true}
    login:
      requests: ${RESERLY_RATE_LIMIT_LOGIN_REQUESTS:10}
      window: ${RESERLY_RATE_LIMIT_LOGIN_WINDOW:5m}
    registration:
      requests: ${RESERLY_RATE_LIMIT_REGISTRATION_REQUESTS:5}
      window: ${RESERLY_RATE_LIMIT_REGISTRATION_WINDOW:1h}
    password-reset-request:
      requests: ${RESERLY_RATE_LIMIT_PASSWORD_RESET_REQUEST_REQUESTS:5}
      window: ${RESERLY_RATE_LIMIT_PASSWORD_RESET_REQUEST_WINDOW:15m}
    password-reset-consume:
      requests: ${RESERLY_RATE_LIMIT_PASSWORD_RESET_CONSUME_REQUESTS:10}
      window: ${RESERLY_RATE_LIMIT_PASSWORD_RESET_CONSUME_WINDOW:15m}
    reservation:
      requests: ${RESERLY_RATE_LIMIT_RESERVATION_REQUESTS:30}
      window: ${RESERLY_RATE_LIMIT_RESERVATION_WINDOW:5m}
    public-link:
      requests: ${RESERLY_RATE_LIMIT_PUBLIC_LINK_REQUESTS:30}
      window: ${RESERLY_RATE_LIMIT_PUBLIC_LINK_WINDOW:5m}
    review:
      requests: ${RESERLY_RATE_LIMIT_REVIEW_REQUESTS:10}
      window: ${RESERLY_RATE_LIMIT_REVIEW_WINDOW:15m}
    business-verification:
      requests: ${RESERLY_RATE_LIMIT_BUSINESS_VERIFICATION_REQUESTS:5}
      window: ${RESERLY_RATE_LIMIT_BUSINESS_VERIFICATION_WINDOW:1h}
    demand-event-ingestion:
      requests: ${RESERLY_RATE_LIMIT_DEMAND_EVENT_REQUESTS:600}
      window: ${RESERLY_RATE_LIMIT_DEMAND_EVENT_WINDOW:1m}
  demand:
    quality:
      cron: "${DEMAND_QUALITY_CRON:0 15 * * * *}"
    retention:
      batchSize: ${RESERLY_DEMAND_RETENTION_BATCH_SIZE:500}
      eventRetention: ${RESERLY_DEMAND_EVENT_RETENTION:90d}
      recommendationRetention: ${RESERLY_DEMAND_RECOMMENDATION_RETENTION:90d}
      minimumAggregateCohort: ${RESERLY_DEMAND_MINIMUM_AGGREGATE_COHORT:10}
      partitionRowThreshold: ${RESERLY_DEMAND_PARTITION_ROW_THRESHOLD:5000000}
      partitionBytesThreshold: ${RESERLY_DEMAND_PARTITION_BYTES_THRESHOLD:1073741824}
      cron: ${RESERLY_DEMAND_RETENTION_CRON:0 35 3 * * *}
    aggregation:
      version: ${RESERLY_DEMAND_AGGREGATION_VERSION:weighted-v1}
      halfLife: ${RESERLY_DEMAND_AGGREGATION_HALF_LIFE:90d}
      volumeSaturation: ${RESERLY_DEMAND_AGGREGATION_VOLUME_SATURATION:20}
      sourceWeights:
        venueDeclaration: 0.10
        structuredCatalog: 0.15
        operational: 0.20
        customerAggregate: 0.15
        verifiedAudit: 0.30
        imageAuxiliary: 0.10
      confidenceFactors:
        diversity: 0.25
        volume: 0.25
        agreement: 0.30
        recency: 0.20
    ingestion:
      enabled: ${RESERLY_DEMAND_INGESTION_ENABLED:true}
      serviceId: ${RESERLY_DEMAND_INGESTION_SERVICE_ID:web-gateway}
      serviceToken: ${RESERLY_DEMAND_INGESTION_SERVICE_TOKEN}
      maximumBatchSize: ${RESERLY_DEMAND_INGESTION_MAXIMUM_BATCH_SIZE:100}
      retention: ${RESERLY_DEMAND_EVENT_RETENTION:90d}
  identity:
    password:
      bcryptStrength: ${RESERLY_PASSWORD_BCRYPT_STRENGTH:12}
    session:
      lifetime: ${RESERLY_SESSION_LIFETIME:12h}
      activityUpdateInterval: ${RESERLY_SESSION_ACTIVITY_UPDATE_INTERVAL:5m}
    emailVerification:
      tokenLifetime: ${RESERLY_EMAIL_VERIFICATION_TOKEN_LIFETIME:24h}
    passwordReset:
      tokenLifetime: ${RESERLY_PASSWORD_RESET_TOKEN_LIFETIME:30m}
  notifications:
    email:
      enabled: ${RESERLY_EMAIL_ENABLED:true}
      provider: ${RESERLY_EMAIL_PROVIDER:mailpit}
      fromAddress: ${RESERLY_EMAIL_FROM_ADDRESS:no-reply@reserly.local}
      fromName: ${RESERLY_EMAIL_FROM_NAME:Reserly}
  features:
    realPaymentsEnabled: ${RESERLY_REAL_PAYMENTS_ENABLED:false}
  payments:
    redsys:
      paymentEndpoint: ${RESERLY_REDSYS_PAYMENT_ENDPOINT:https://sis-t.redsys.es:25443/sis/realizarPago}
      merchantCode: ${RESERLY_REDSYS_MERCHANT_CODE:}
      terminal: ${RESERLY_REDSYS_TERMINAL:}
      signingKey: ${RESERLY_REDSYS_SIGNING_KEY:}
  statistics:
    daily:
      cron: "${RESERLY_STATISTICS_DAILY_CRON:0 15 0 * * *}"
  incidents:
    retention:
      operationalMonths: ${RESERLY_INCIDENT_RETENTION_OPERATIONAL_MONTHS:12}
      evidenceMonths: ${RESERLY_INCIDENT_RETENTION_EVIDENCE_MONTHS:36}
      cron: "${RESERLY_INCIDENT_RETENTION_CRON:0 45 2 * * *}"
  venues:
    images:
      upload:
        maxBytes: ${RESERLY_VENUE_IMAGE_MAX_BYTES:5242880}
        minDimension: ${RESERLY_VENUE_IMAGE_MIN_DIMENSION:320}
        maxDimension: ${RESERLY_VENUE_IMAGE_MAX_DIMENSION:4096}
        maxPixels: ${RESERLY_VENUE_IMAGE_MAX_PIXELS:16777216}
      storage:
        endpoint: ${RESERLY_S3_ENDPOINT:http://localhost:9000}
        bucket: ${RESERLY_VENUE_IMAGE_S3_BUCKET:reserly-local-venue-images}
        accessKey: ${RESERLY_S3_ACCESS_KEY:reserly-minio-local}
        secretKey: ${RESERLY_S3_SECRET_KEY:reserly-minio-local-secret}
        region: ${RESERLY_S3_REGION:us-east-1}
        createBucket: ${RESERLY_S3_CREATE_BUCKET:true}
  business-verification:
    documents:
      upload:
        maxBytes: ${RESERLY_DOCUMENT_MAX_BYTES:10485760}
      encryption:
        keyId: ${RESERLY_DOCUMENT_ENCRYPTION_KEY_ID:local-dev-v1}
        keyBase64: ${RESERLY_DOCUMENT_ENCRYPTION_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      storage:
        endpoint: ${RESERLY_S3_ENDPOINT:http://localhost:9000}
        bucket: ${RESERLY_S3_BUCKET:reserly-local}
        accessKey: ${RESERLY_S3_ACCESS_KEY:reserly-minio-local}
        secretKey: ${RESERLY_S3_SECRET_KEY:reserly-minio-local-secret}
        region: ${RESERLY_S3_REGION:us-east-1}
        createBucket: ${RESERLY_S3_CREATE_BUCKET:true}
      antivirus:
        host: ${RESERLY_CLAMAV_HOST:localhost}
        port: ${RESERLY_CLAMAV_PORT:3310}
        connectTimeout: ${RESERLY_CLAMAV_CONNECT_TIMEOUT:2s}
        readTimeout: ${RESERLY_CLAMAV_READ_TIMEOUT:20s}
    state:
      validityPeriod: ${RESERLY_BUSINESS_VERIFICATION_VALIDITY_PERIOD:365d}
    matching:
      legalNameThreshold: ${RESERLY_BUSINESS_VERIFICATION_NAME_MATCH_THRESHOLD:0.85}
      addressThreshold: ${RESERLY_BUSINESS_VERIFICATION_ADDRESS_MATCH_THRESHOLD:0.75}
    remote:
      connectTimeout: ${RESERLY_BUSINESS_VERIFICATION_CONNECT_TIMEOUT:2s}
      readTimeout: ${RESERLY_BUSINESS_VERIFICATION_READ_TIMEOUT:5s}
      maxAttempts: ${RESERLY_BUSINESS_VERIFICATION_MAX_ATTEMPTS:3}
      initialBackoff: ${RESERLY_BUSINESS_VERIFICATION_INITIAL_BACKOFF:250ms}
      maxBackoff: ${RESERLY_BUSINESS_VERIFICATION_MAX_BACKOFF:2s}
      backoffMultiplier: ${RESERLY_BUSINESS_VERIFICATION_BACKOFF_MULTIPLIER:2.0}
    vies:
      endpoint: ${RESERLY_VIES_ENDPOINT:https://ec.europa.eu/taxation_customs/vies/services/checkVatService}
      maxResponseBytes: ${RESERLY_VIES_MAX_RESPONSE_BYTES:65536}
