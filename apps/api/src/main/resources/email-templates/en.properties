emailVerification.subject=Verify your email address for Reserly
emailVerification.text=Welcome to Reserly. Verify your email by opening this link:\n{{actionUrl}}\n\nThe link expires on {{expiresAt}}. If you did not create this account, you can ignore this message.
emailVerification.html=<!doctype html><html lang="en"><body><h1>Verify your email address</h1><p>Welcome to Reserly.</p><p><a href="{{actionUrl}}">Verify email address</a></p><p>The link expires on {{expiresAt}}.</p><p>If you did not create this account, you can ignore this message.</p></body></html>
passwordReset.subject=Reset your Reserly password
passwordReset.text=We received a request to reset your password. Open this link:\n{{actionUrl}}\n\nThe link expires on {{expiresAt}}. If you did not request this change, you do not need to do anything.
passwordReset.html=<!doctype html><html lang="en"><body><h1>Reset your password</h1><p>We received a request to reset your password.</p><p><a href="{{actionUrl}}">Create a new password</a></p><p>The link expires on {{expiresAt}}.</p><p>If you did not request this change, you do not need to do anything.</p></body></html>
reservationConfirmation.subject=Your booking at {{venueName}} is confirmed
reservationConfirmation.noResponses=There are no additional answers.
reservationConfirmation.text=Your booking is confirmed.\n\nVenue: {{venueName}}\nAddress: {{venueAddress}}\nDate: {{reservationDate}}\nTime: {{reservationTime}}\nGuests: {{partySize}}\n\nAnswers:\n{{responses}}\n\nCancellation and no-show policy:\n{{bookingRules}}\n\nView or cancel your booking securely:\n{{manageUrl}}\nThe link expires on {{manageTokenExpiresAt}}. Do not share this link.
reservationConfirmation.html=<!doctype html><html lang="en"><body><h1>Your booking is confirmed</h1><dl><dt>Venue</dt><dd>{{venueName}}</dd><dt>Address</dt><dd>{{venueAddress}}</dd><dt>Date</dt><dd>{{reservationDate}}</dd><dt>Time</dt><dd>{{reservationTime}}</dd><dt>Guests</dt><dd>{{partySize}}</dd></dl><h2>Answers</h2>{{responses}}<h2>Cancellation and no-show policy</h2><p>{{bookingRules}}</p><p><a href="{{manageUrl}}">View or cancel the booking</a></p><p>The link expires on {{manageTokenExpiresAt}}. Do not share this link.</p></body></html>
venueReservationNotification.subject=New booking: {{customerName}} — {{reservationDate}}
venueReservationNotification.noResponses=There are no additional answers.
venueReservationNotification.text=A new booking has been confirmed at {{venueName}}.\n\nCustomer: {{customerName}}\nEmail address: {{customerEmail}}\nDate: {{reservationDate}}\nTime: {{reservationTime}}\nGuests: {{partySize}}\n\nAnswers:\n{{responses}}\n\nReview the booking in the dashboard before contacting the customer.
venueReservationNotification.html=<!doctype html><html lang="en"><body><h1>New booking confirmed</h1><p>A new booking has been confirmed at {{venueName}}.</p><dl><dt>Customer</dt><dd>{{customerName}}</dd><dt>Email address</dt><dd>{{customerEmail}}</dd><dt>Date</dt><dd>{{reservationDate}}</dd><dt>Time</dt><dd>{{reservationTime}}</dd><dt>Guests</dt><dd>{{partySize}}</dd></dl><h2>Answers</h2>{{responses}}<p>Review the booking in the dashboard before contacting the customer.</p></body></html>
userCancellationNotice.subject=Booking cancelled by the customer: {{reservationDate}}
userCancellationNotice.text=The customer has cancelled their booking at {{venueName}}.\n\nCustomer: {{customerName}}\nEmail address: {{customerEmail}}\nDate: {{reservationDate}}\nTime: {{reservationTime}}\nGuests: {{partySize}}\n\nThe booking is no longer active.
userCancellationNotice.html=<!doctype html><html lang="en"><body><h1>Booking cancelled by the customer</h1><p>The customer has cancelled their booking at {{venueName}}.</p><dl><dt>Customer</dt><dd>{{customerName}}</dd><dt>Email address</dt><dd>{{customerEmail}}</dd><dt>Date</dt><dd>{{reservationDate}}</dd><dt>Time</dt><dd>{{reservationTime}}</dd><dt>Guests</dt><dd>{{partySize}}</dd></dl><p>The booking is no longer active.</p></body></html>
venueCancellationNotice.subject={{venueName}} has cancelled your booking
venueCancellationNotice.text=The venue has cancelled your booking.\n\nVenue: {{venueName}}\nAddress: {{venueAddress}}\nDate: {{reservationDate}}\nTime: {{reservationTime}}\nGuests: {{partySize}}\nReason: {{cancellationReason}}\n\nYou do not need to take any action, and this cancellation will not be treated as a no-show.
venueCancellationNotice.html=<!doctype html><html lang="en"><body><h1>The venue has cancelled your booking</h1><dl><dt>Venue</dt><dd>{{venueName}}</dd><dt>Address</dt><dd>{{venueAddress}}</dd><dt>Date</dt><dd>{{reservationDate}}</dd><dt>Time</dt><dd>{{reservationTime}}</dd><dt>Guests</dt><dd>{{partySize}}</dd><dt>Reason</dt><dd>{{cancellationReason}}</dd></dl><p>You do not need to take any action, and this cancellation will not be treated as a no-show.</p></body></html>
