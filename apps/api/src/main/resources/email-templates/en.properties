emailVerification.subject=Verify your email address for Reserly
emailVerification.text=Welcome to Reserly. Verify your email by opening this link:\n{{actionUrl}}\n\nThe link expires on {{expiresAt}}. If you did not create this account, you can ignore this message.
emailVerification.html=<!doctype html><html lang="en"><body><h1>Verify your email address</h1><p>Welcome to Reserly.</p><p><a href="{{actionUrl}}">Verify email address</a></p><p>The link expires on {{expiresAt}}.</p><p>If you did not create this account, you can ignore this message.</p></body></html>
passwordReset.subject=Reset your Reserly password
passwordReset.text=We received a request to reset your password. Open this link:\n{{actionUrl}}\n\nThe link expires on {{expiresAt}}. If you did not request this change, you do not need to do anything.
passwordReset.html=<!doctype html><html lang="en"><body><h1>Reset your password</h1><p>We received a request to reset your password.</p><p><a href="{{actionUrl}}">Create a new password</a></p><p>The link expires on {{expiresAt}}.</p><p>If you did not request this change, you do not need to do anything.</p></body></html>
reservationConfirmation.subject=Your booking at {{venueName}} is confirmed
reservationConfirmation.noResponses=There are no additional answers.
reservationConfirmation.text=Hello {{customerName}},\n\nYour booking is confirmed!\n\nVenue: {{venueName}}\nAddress: {{venueAddress}}\nDate: {{reservationDate}}\nTime: {{reservationTime}}\nGuests: {{partySize}}\n\nAnswers:\n{{responses}}\n\nCancellation and no-show policy:\n{{bookingRules}}\n\nView or cancel your booking securely:\n{{manageUrl}}\nThe link expires on {{manageTokenExpiresAt}}. Do not share this link.
reservationConfirmation.html=<!doctype html><html lang="en"><body style="margin:0;background:#f5f7fb;color:#152238;font-family:Arial,sans-serif"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td style="padding:32px 16px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;margin:auto;background:#ffffff;border:1px solid #e4e9f2;border-radius:16px"><tr><td style="padding:24px 32px;border-bottom:1px solid #e4e9f2;color:#075fd8;font-size:20px;font-weight:700">▣ Reserly</td></tr><tr><td style="padding:32px"><div style="width:52px;height:52px;line-height:52px;text-align:center;background:#16a56a;color:#fff;border-radius:50%;font-size:28px">✓</div><h1 style="margin:20px 0 8px;font-size:26px">Your booking is confirmed!</h1><p style="margin:0 0 24px;color:#5c6b80">Hello {{customerName}}, here are all the details.</p><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f9fc;border-radius:12px"><tr><td style="padding:20px"><strong>{{venueName}}</strong><br><span style="color:#5c6b80">{{venueAddress}}</span><br><br><strong>Date</strong><br>{{reservationDate}}<br><br><strong>Time</strong><br>{{reservationTime}}<br><br><strong>Guests</strong><br>{{partySize}}</td></tr></table><h2 style="margin:28px 0 12px;font-size:18px">Booking details</h2>{{responses}}<h2 style="margin:28px 0 12px;font-size:18px">Cancellation and no-show policy</h2><p style="color:#5c6b80">{{bookingRules}}</p><p style="margin:28px 0"><a href="{{manageUrl}}" style="display:block;padding:14px 20px;background:#075fd8;color:#fff;text-align:center;text-decoration:none;border-radius:8px;font-weight:700">View or manage my booking</a></p><p style="font-size:12px;color:#7a8799">The link expires on {{manageTokenExpiresAt}}. For your security, do not share it.</p></td></tr></table></td></tr></table></body></html>
venueReservationNotification.subject=New booking: {{customerName}} — {{reservationDate}}
venueReservationNotification.noResponses=There are no additional answers.
venueReservationNotification.text=You have received a new booking at {{venueName}}.\n\nCustomer: {{customerName}}\nEmail address: {{customerEmail}}\nDate: {{reservationDate}}\nTime: {{reservationTime}}\nGuests: {{partySize}}\n\nAnswers:\n{{responses}}\n\nView in the dashboard:\n{{panelUrl}}\nReview the booking before contacting the customer.
venueReservationNotification.html=<!doctype html><html lang="en"><body style="margin:0;background:#f5f7fb;color:#152238;font-family:Arial,sans-serif"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td style="padding:32px 16px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;margin:auto;background:#ffffff;border:1px solid #e4e9f2;border-radius:16px"><tr><td style="padding:24px 32px;border-bottom:1px solid #e4e9f2;color:#075fd8;font-size:20px;font-weight:700">▣ Reserly</td></tr><tr><td style="padding:32px"><p style="margin:0;color:#075fd8;font-weight:700">New booking received</p><h1 style="margin:8px 0 24px;font-size:26px">You have received a new booking</h1><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f9fc;border-radius:12px"><tr><td style="padding:20px"><strong>Customer</strong><br>{{customerName}}<br><span style="color:#5c6b80">{{customerEmail}}</span><br><br><strong>Date and time</strong><br>{{reservationDate}} · {{reservationTime}}<br><br><strong>Guests</strong><br>{{partySize}}</td></tr></table><h2 style="margin:28px 0 12px;font-size:18px">Form answers</h2>{{responses}}<p style="margin:28px 0"><a href="{{panelUrl}}" style="display:block;padding:14px 20px;background:#075fd8;color:#fff;text-align:center;text-decoration:none;border-radius:8px;font-weight:700">View booking in dashboard</a></p><p style="font-size:12px;color:#7a8799">Review the booking before contacting the customer.</p></td></tr></table></td></tr></table></body></html>
userCancellationNotice.subject=Booking cancelled by the customer: {{reservationDate}}
userCancellationNotice.text=The customer has cancelled their booking at {{venueName}}.\n\nCustomer: {{customerName}}\nEmail address: {{customerEmail}}\nDate: {{reservationDate}}\nTime: {{reservationTime}}\nGuests: {{partySize}}\n\nThe booking is no longer active.
userCancellationNotice.html=<!doctype html><html lang="en"><body><h1>Booking cancelled by the customer</h1><p>The customer has cancelled their booking at {{venueName}}.</p><dl><dt>Customer</dt><dd>{{customerName}}</dd><dt>Email address</dt><dd>{{customerEmail}}</dd><dt>Date</dt><dd>{{reservationDate}}</dd><dt>Time</dt><dd>{{reservationTime}}</dd><dt>Guests</dt><dd>{{partySize}}</dd></dl><p>The booking is no longer active.</p></body></html>
venueCancellationNotice.subject={{venueName}} has cancelled your booking
venueCancellationNotice.text=The venue has cancelled your booking.\n\nVenue: {{venueName}}\nAddress: {{venueAddress}}\nDate: {{reservationDate}}\nTime: {{reservationTime}}\nGuests: {{partySize}}\nReason: {{cancellationReason}}\n\nYou do not need to take any action, and this cancellation will not be treated as a no-show.
venueCancellationNotice.html=<!doctype html><html lang="en"><body><h1>The venue has cancelled your booking</h1><dl><dt>Venue</dt><dd>{{venueName}}</dd><dt>Address</dt><dd>{{venueAddress}}</dd><dt>Date</dt><dd>{{reservationDate}}</dd><dt>Time</dt><dd>{{reservationTime}}</dd><dt>Guests</dt><dd>{{partySize}}</dd><dt>Reason</dt><dd>{{cancellationReason}}</dd></dl><p>You do not need to take any action, and this cancellation will not be treated as a no-show.</p></body></html>
