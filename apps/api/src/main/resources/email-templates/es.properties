emailVerification.subject=Verifica tu correo electrónico en Reserly
emailVerification.text=Te damos la bienvenida a Reserly. Verifica tu correo abriendo este enlace:\n{{actionUrl}}\n\nEl enlace caduca el {{expiresAt}}. Si no creaste esta cuenta, puedes ignorar este mensaje.
emailVerification.html=<!doctype html><html lang="es"><body><h1>Verifica tu correo electrónico</h1><p>Te damos la bienvenida a Reserly.</p><p><a href="{{actionUrl}}">Verificar correo electrónico</a></p><p>El enlace caduca el {{expiresAt}}.</p><p>Si no creaste esta cuenta, puedes ignorar este mensaje.</p></body></html>
passwordReset.subject=Restablece tu contraseña de Reserly
passwordReset.text=Hemos recibido una solicitud para restablecer tu contraseña. Abre este enlace:\n{{actionUrl}}\n\nEl enlace caduca el {{expiresAt}}. Si no solicitaste el cambio, no tienes que hacer nada.
passwordReset.html=<!doctype html><html lang="es"><body><h1>Restablece tu contraseña</h1><p>Hemos recibido una solicitud para restablecer tu contraseña.</p><p><a href="{{actionUrl}}">Crear una contraseña nueva</a></p><p>El enlace caduca el {{expiresAt}}.</p><p>Si no solicitaste el cambio, no tienes que hacer nada.</p></body></html>
reservationConfirmation.subject=Tu reserva en {{venueName}} está confirmada
reservationConfirmation.noResponses=No hay respuestas adicionales.
reservationConfirmation.text=Hola {{customerName}},\n\n¡Tu reserva está confirmada!\n\nLocal: {{venueName}}\nDirección: {{venueAddress}}\nFecha: {{reservationDate}}\nHora: {{reservationTime}}\nPersonas: {{partySize}}\n\nRespuestas:\n{{responses}}\n\nPolítica de cancelación y no asistencia:\n{{bookingRules}}\n\nConsulta o cancela tu reserva de forma segura:\n{{manageUrl}}\nEl enlace caduca el {{manageTokenExpiresAt}}. No compartas este enlace.
reservationConfirmation.html=<!doctype html><html lang="es"><body style="margin:0;background:#f5f7fb;color:#152238;font-family:Arial,sans-serif"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td style="padding:32px 16px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;margin:auto;background:#ffffff;border:1px solid #e4e9f2;border-radius:16px"><tr><td style="padding:24px 32px;border-bottom:1px solid #e4e9f2;color:#075fd8;font-size:20px;font-weight:700">▣ Reserly</td></tr><tr><td style="padding:32px"><div style="width:52px;height:52px;line-height:52px;text-align:center;background:#16a56a;color:#fff;border-radius:50%;font-size:28px">✓</div><h1 style="margin:20px 0 8px;font-size:26px">¡Tu reserva está confirmada!</h1><p style="margin:0 0 24px;color:#5c6b80">Hola {{customerName}}, aquí tienes todos los detalles.</p><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f9fc;border-radius:12px"><tr><td style="padding:20px"><strong>{{venueName}}</strong><br><span style="color:#5c6b80">{{venueAddress}}</span><br><br><strong>Fecha</strong><br>{{reservationDate}}<br><br><strong>Horario</strong><br>{{reservationTime}}<br><br><strong>Personas</strong><br>{{partySize}}</td></tr></table><h2 style="margin:28px 0 12px;font-size:18px">Datos de la reserva</h2>{{responses}}<h2 style="margin:28px 0 12px;font-size:18px">Política de cancelación y no asistencia</h2><p style="color:#5c6b80">{{bookingRules}}</p><p style="margin:28px 0"><a href="{{manageUrl}}" style="display:block;padding:14px 20px;background:#075fd8;color:#fff;text-align:center;text-decoration:none;border-radius:8px;font-weight:700">Ver o gestionar mi reserva</a></p><p style="font-size:12px;color:#7a8799">El enlace caduca el {{manageTokenExpiresAt}}. Por seguridad, no lo compartas.</p></td></tr></table></td></tr></table></body></html>
venueReservationNotification.subject=Nueva reserva: {{customerName}} — {{reservationDate}}
venueReservationNotification.noResponses=No hay respuestas adicionales.
venueReservationNotification.text=Has recibido una nueva reserva en {{venueName}}.\n\nUsuario: {{customerName}}\nCorreo electrónico: {{customerEmail}}\nFecha: {{reservationDate}}\nHora: {{reservationTime}}\nPersonas: {{partySize}}\n\nRespuestas:\n{{responses}}\n\nVer en el panel:\n{{panelUrl}}\nRevisa la reserva antes de contactar al usuario.
venueReservationNotification.html=<!doctype html><html lang="es"><body style="margin:0;background:#f5f7fb;color:#152238;font-family:Arial,sans-serif"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td style="padding:32px 16px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;margin:auto;background:#ffffff;border:1px solid #e4e9f2;border-radius:16px"><tr><td style="padding:24px 32px;border-bottom:1px solid #e4e9f2;color:#075fd8;font-size:20px;font-weight:700">▣ Reserly</td></tr><tr><td style="padding:32px"><p style="margin:0;color:#075fd8;font-weight:700">Nueva reserva recibida</p><h1 style="margin:8px 0 24px;font-size:26px">Has recibido una nueva reserva</h1><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f9fc;border-radius:12px"><tr><td style="padding:20px"><strong>Usuario</strong><br>{{customerName}}<br><span style="color:#5c6b80">{{customerEmail}}</span><br><br><strong>Fecha y horario</strong><br>{{reservationDate}} · {{reservationTime}}<br><br><strong>Personas</strong><br>{{partySize}}</td></tr></table><h2 style="margin:28px 0 12px;font-size:18px">Respuestas del formulario</h2>{{responses}}<p style="margin:28px 0"><a href="{{panelUrl}}" style="display:block;padding:14px 20px;background:#075fd8;color:#fff;text-align:center;text-decoration:none;border-radius:8px;font-weight:700">Ver reserva en el panel</a></p><p style="font-size:12px;color:#7a8799">Revisa la reserva antes de contactar al usuario.</p></td></tr></table></td></tr></table></body></html>
userCancellationNotice.subject=Reserva cancelada por el usuario: {{reservationDate}}
userCancellationNotice.text=El usuario ha cancelado su reserva en {{venueName}}.\n\nUsuario: {{customerName}}\nCorreo electrónico: {{customerEmail}}\nFecha: {{reservationDate}}\nHora: {{reservationTime}}\nPersonas: {{partySize}}\n\nLa reserva ya no está activa.
userCancellationNotice.html=<!doctype html><html lang="es"><body><h1>Reserva cancelada por el usuario</h1><p>El usuario ha cancelado su reserva en {{venueName}}.</p><dl><dt>Usuario</dt><dd>{{customerName}}</dd><dt>Correo electrónico</dt><dd>{{customerEmail}}</dd><dt>Fecha</dt><dd>{{reservationDate}}</dd><dt>Hora</dt><dd>{{reservationTime}}</dd><dt>Personas</dt><dd>{{partySize}}</dd></dl><p>La reserva ya no está activa.</p></body></html>
venueCancellationNotice.subject={{venueName}} ha cancelado tu reserva
venueCancellationNotice.text=El local ha cancelado tu reserva.\n\nLocal: {{venueName}}\nDirección: {{venueAddress}}\nFecha: {{reservationDate}}\nHora: {{reservationTime}}\nPersonas: {{partySize}}\nMotivo: {{cancellationReason}}\n\nNo necesitas realizar ninguna acción y esta cancelación no se considera una no asistencia.
venueCancellationNotice.html=<!doctype html><html lang="es"><body><h1>El local ha cancelado tu reserva</h1><dl><dt>Local</dt><dd>{{venueName}}</dd><dt>Dirección</dt><dd>{{venueAddress}}</dd><dt>Fecha</dt><dd>{{reservationDate}}</dd><dt>Hora</dt><dd>{{reservationTime}}</dd><dt>Personas</dt><dd>{{partySize}}</dd><dt>Motivo</dt><dd>{{cancellationReason}}</dd></dl><p>No necesitas realizar ninguna acción y esta cancelación no se considera una no asistencia.</p></body></html>
