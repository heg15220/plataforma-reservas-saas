emailVerification.subject=Verifica tu correo electrónico en Reserly
emailVerification.text=Te damos la bienvenida a Reserly. Verifica tu correo abriendo este enlace:\n{{actionUrl}}\n\nEl enlace caduca el {{expiresAt}}. Si no creaste esta cuenta, puedes ignorar este mensaje.
emailVerification.html=<!doctype html><html lang="es"><body><h1>Verifica tu correo electrónico</h1><p>Te damos la bienvenida a Reserly.</p><p><a href="{{actionUrl}}">Verificar correo electrónico</a></p><p>El enlace caduca el {{expiresAt}}.</p><p>Si no creaste esta cuenta, puedes ignorar este mensaje.</p></body></html>
passwordReset.subject=Restablece tu contraseña de Reserly
passwordReset.text=Hemos recibido una solicitud para restablecer tu contraseña. Abre este enlace:\n{{actionUrl}}\n\nEl enlace caduca el {{expiresAt}}. Si no solicitaste el cambio, no tienes que hacer nada.
passwordReset.html=<!doctype html><html lang="es"><body><h1>Restablece tu contraseña</h1><p>Hemos recibido una solicitud para restablecer tu contraseña.</p><p><a href="{{actionUrl}}">Crear una contraseña nueva</a></p><p>El enlace caduca el {{expiresAt}}.</p><p>Si no solicitaste el cambio, no tienes que hacer nada.</p></body></html>
reservationConfirmation.subject=Tu reserva en {{venueName}} está confirmada
reservationConfirmation.noResponses=No hay respuestas adicionales.
reservationConfirmation.text=Tu reserva está confirmada.\n\nLocal: {{venueName}}\nDirección: {{venueAddress}}\nFecha: {{reservationDate}}\nHora: {{reservationTime}}\nPersonas: {{partySize}}\n\nRespuestas:\n{{responses}}\n\nPolítica de cancelación y no asistencia:\n{{bookingRules}}\n\nConsulta o cancela tu reserva de forma segura:\n{{manageUrl}}\nEl enlace caduca el {{manageTokenExpiresAt}}. No compartas este enlace.
reservationConfirmation.html=<!doctype html><html lang="es"><body><h1>Tu reserva está confirmada</h1><dl><dt>Local</dt><dd>{{venueName}}</dd><dt>Dirección</dt><dd>{{venueAddress}}</dd><dt>Fecha</dt><dd>{{reservationDate}}</dd><dt>Hora</dt><dd>{{reservationTime}}</dd><dt>Personas</dt><dd>{{partySize}}</dd></dl><h2>Respuestas</h2>{{responses}}<h2>Política de cancelación y no asistencia</h2><p>{{bookingRules}}</p><p><a href="{{manageUrl}}">Consultar o cancelar la reserva</a></p><p>El enlace caduca el {{manageTokenExpiresAt}}. No compartas este enlace.</p></body></html>
